name: Lint and Format

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-php:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: phpcbf, phpcs
    
    - name: Check PHP coding standards
      run: |
        if command -v phpcs &> /dev/null; then
          phpcs --standard=PSR12 --extensions=php --ignore=vendor/,lib/ . || echo "PHP CodeSniffer not configured, skipping..."
        else
          echo "Skipping PHP CodeSniffer - not installed"
        fi
  
  lint-js:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Check JavaScript files
      run: |
        echo "Checking for JavaScript syntax errors..."
        find . -name "*.js" -not -path "./node_modules/*" -not -path "./lib/*" | while read file; do
          node --check "$file" || exit 1
        done
        echo "JavaScript syntax check passed"

